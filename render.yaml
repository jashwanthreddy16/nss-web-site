services:
  - type: web
    name: nss-web-site
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        value: admin@rgukt.ac.in
      - key: ADMIN_PASSWORD
        sync: false
